<!DOCTYPE html>
<html lang="en">

<head>
    <title>AJAX StarWars demo</title>
    <script>
        function loadXMLDoc(deoImena, pol, dzedaj) {
            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function () {
                if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
                    document.getElementById('result').innerText = xmlhttp.responseText;
                    console.log("Odgovor veb servisa je uspešno učitan!");
                } else
                    if (xmlhttp.status != 200 && xmlhttp.status != 0)
                        console.log("Greška: " + xmlhttp.status + ": " + xmlhttp.statusText);
            }
            xmlhttp.open('GET', `http://127.0.0.1:7000/star-wars/pretraga?ime=${deoImena}&pol=${pol}&dzedaj=${dzedaj}`);
            xmlhttp.send();
        }
    </script>
</head>

<body>
    <h2>StarWars heroji i AJAX</h2>
    <div id="question">
        <input type="text" id="deoImena" placeholder="Unesite deo imena heroja">
        <button type="button" onclick="loadXMLDoc(document.getElementById('deoImena').value, '', '')"> Pošalji AJAX
            zahtev</button>
    </div>
    <div id="result">
    </div>

</body>

</html>
