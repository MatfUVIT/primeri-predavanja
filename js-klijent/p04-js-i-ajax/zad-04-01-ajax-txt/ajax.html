<!DOCTYPE html>
<html lang="en">

<head>
    <title>AJAX demo</title>
    <script>
        function loadXMLDoc() {
            let fileName = document.getElementById("fileName").value;
            let zahtev = new XMLHttpRequest();
            zahtev.onreadystatechange = function () {
                if (zahtev.readyState == 4 && zahtev.status == 200) {
                    document.getElementById("myDiv").innerHTML = zahtev.responseText;
                    console.log("Spoljašnji sadržaj je uspešno učitan!");
                } else
                    if (zahtev.status != 200 && zahtev.status != 0)
                        console.log("Greška: " + zahtev.status + ": " + zahtev.statusText);
            }
            zahtev.open("GET", fileName, true);
            zahtev.send();
        }
    </script>
</head>

<body>
    <h2>Odgovor dobijen putem AJAX-a</h2>
    <input id="fileName" type="text" value="ajax.txt">
    <button type="button" onclick="loadXMLDoc()"> Pošalji AJAX zahtev</button>
    <div id="myDiv"></div>
</body>

</html>
